name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # HytaleServer.jar is not available in CI, so this builds and tests the
      # engine-agnostic core only (the plugin entry point is auto-excluded).
      - name: Test and build core
        run: ./gradlew test build --console=plain
