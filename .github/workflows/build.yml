name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 8.10 itself runs on JDK 21; the Java 25 compile toolchain is
      # auto-provisioned by the foojay resolver (see settings.gradle).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # HytaleServer.jar is not available in CI, so this builds and tests the
      # engine-agnostic core only (the plugin entry point is auto-excluded).
      - name: Test and build core
        run: ./gradlew test build --console=plain
